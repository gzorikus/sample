name: Instant Close Manual PRs

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  close-manual:
    runs-on: ubuntu-latest
    steps:
      - name: Check if original author was bot
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const originalAuthor = pr.user.login;
            const headRef = pr.head.ref;

            if (headRef.startsWith('PR/') && originalAuthor !== 'github-actions[bot]') {
              console.log(`Manual PR detected from ${originalAuthor}, closing...`);

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: '❌ Manual PRs are not allowed.'
              });

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed'
              });
            } else {
              console.log(`Bot PR or non-PR/* branch, allowing reopen`);
            }
