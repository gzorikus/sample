name: Enforce Automated PRs

on:
  pull_request:
    types: [opened]

jobs:
  check-author:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    # Adjust the actor check if using a custom GitHub App token instead of the default token
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Close Manual PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Manual PR detected from user: ${{ github.actor }}"
          
          # 1. Post a comment explaining why the PR is being rejected
          gh pr comment ${{ github.event.pull_request.number }} --body "❌ **Manual PRs are not allowed.** Pull requests must be automatically generated by pushing your branch matching the pattern to GitHub."
          
          # 2. Close the PR automatically
          gh pr close ${{ github.event.pull_request.number }}
